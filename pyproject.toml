[project]
name = "slicer-mcp"
version = "0.1.0"
description = "A secure 3D Slicer MCP server for VLM agents: named, bounded tools; no code execution; auditable traces; per-task tool allowlists"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pillow>=10.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "scipy>=1.15.3",
    "simpleitk>=2.4",
]

[project.scripts]
slicer-mcp = "slicer_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slicer_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slicer: integration test that needs the live bridge on SLICER_URL (default http://127.0.0.1:2017)"]
addopts = "-m 'not slicer'"
